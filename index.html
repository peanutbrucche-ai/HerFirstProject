<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #222;
            color: white;
        }

    </style>

</head>

<body>

    <header>

        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>


    <section class="hero">

        <h1>Welcome! 👋</h1>

        <p>
            This is my first website created with HTML and CSS.
        </p>

        <button onclick="sayHello()">
            Click Me
        </button>

    </section>


    <footer>

        <p>© 2026 My Website</p>

    </footer>


    <script>

        function sayHello() {
            alert("Hello! Thanks for visiting my website! 🎉");
        }

    </script>

</body>

</html>
